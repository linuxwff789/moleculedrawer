name: Android Build

on:
  push:
    branches: [master, main]
    tags: ['v*']             # 打 v* tag 触发发布
  pull_request:
    branches: [master, main]
  workflow_dispatch:         # 支持手动触发（填 tag 则同时发布 Release）
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0，留空则只构建不发布）'
        required: false
        default: ''

permissions:
  contents: write             # 允许创建 GitHub Release / tag

jobs:
  build:
    name: Build Debug APK
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}   # tag 触发时只跑 release，避免重复构建
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # 默认的 'tools' 包已被 Google 下架，会导致 sdkmanager 失败

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :moleculedrawer:assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          USE_MIRRORS: "false"   # CI 在海外，禁用国内镜像仓库

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moleculedrawer-debug-apk
          path: moleculedrawer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build & Publish Release APK
    # v* tag push，或手动触发且填了 tag
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # 默认的 'tools' 包已被 Google 下架，会导致 sdkmanager 失败

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release 构建（R8 混淆 + 仓库固定 keystore 签名）；失败时回退 Debug，保证发布不被混淆问题卡死
      - name: Build Release APK
        id: release_build
        continue-on-error: true
        run: ./gradlew :moleculedrawer:assembleRelease --no-daemon --stacktrace
        env:
          USE_MIRRORS: "false"

      - name: Fallback to Debug APK
        if: ${{ steps.release_build.outcome != 'success' }}
        run: ./gradlew :moleculedrawer:assembleDebug --no-daemon --stacktrace
        env:
          USE_MIRRORS: "false"

      - name: Prepare release asset
        id: prep
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          REL=moleculedrawer/build/outputs/apk/release
          DBG=moleculedrawer/build/outputs/apk/debug
          mkdir -p dist
          if compgen -G "$REL/*.apk" > /dev/null; then
            SRC=$(ls "$REL"/*.apk | head -n1); KIND=release
          elif compgen -G "$DBG/*.apk" > /dev/null; then
            SRC=$(ls "$DBG"/*.apk | head -n1); KIND=debug
          else
            echo "::error::未找到任何 APK 产物"; exit 1
          fi
          ASSET="moleculedrawer-${TAG}-${KIND}-arm64-v8a.apk"
          cp "$SRC" "dist/$ASSET"
          ls -lh dist/
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MoleculeDrawer ${{ steps.prep.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            - 构建类型：${{ steps.prep.outputs.kind }}（arm64-v8a）
            - 签名：仓库固定 keystore（与 CI debug 产物同签名，可覆盖安装）
